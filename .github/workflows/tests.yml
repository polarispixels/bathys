name: tests

# Every push and pull request runs the full check suite. Deploying to Forge
# will be added as a job that runs only after this one passes (Phase 1,
# step 17; see docs/deployment.md).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Same engine as production. `composer setup` migrates against it; the
    # PHP test suite uses its own database settings from phpunit.xml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bathys
          POSTGRES_USER: bathys
          POSTGRES_PASSWORD: bathys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bathys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One PHP version everywhere: composer.json platform, CI, Forge site,
      # queue worker, scheduler. See docs/deployment.md.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Throwaway credentials for the CI-only database above; not secrets.
      - name: Setup Application
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: bathys
          DB_USERNAME: bathys
          DB_PASSWORD: bathys
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

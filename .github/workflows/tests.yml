name: tests

# Every push and pull request runs the full check suite. Pushes to main that
# pass are then deployed to Forge by the `deploy` job (see docs/deployment.md).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Throwaway credentials for the CI-only database below; not secrets. Job
    # level, so `composer setup` and `composer ci:check` (the test suite) both
    # see them. PHPUnit does not override variables that are already set.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bathys
      DB_USERNAME: bathys
      DB_PASSWORD: bathys

    # Same engine as production.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bathys
          POSTGRES_USER: bathys
          POSTGRES_PASSWORD: bathys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bathys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One PHP version everywhere: composer.json platform, CI, Forge site,
      # queue worker, scheduler. See docs/deployment.md.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # Only for pushes to main, and only once every check above has passed.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trigger the Forge deployment
        id: trigger
        env:
          FORGE_DEPLOY_HOOK: ${{ secrets.FORGE_DEPLOY_HOOK }}
        run: |
          if [ -z "$FORGE_DEPLOY_HOOK" ]; then
            echo "::warning::FORGE_DEPLOY_HOOK is not set; skipping the deploy."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST -o /dev/null "$FORGE_DEPLOY_HOOK"
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      # A deploy is done when the live site reports the released version.
      - name: Verify the live version
        if: steps.trigger.outputs.triggered == 'true'
        run: |
          expected=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 40); do
            live=$(curl -fsS https://bathys.polarispixels.com/ | grep -o 'name="app-version" content="[^"]*"' | cut -d'"' -f4 || true)
            if [ "$live" = "$expected" ]; then
              echo "Live version $live matches package.json."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Live version '$live' never matched package.json '$expected'."
          exit 1
